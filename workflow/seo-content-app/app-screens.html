const nav=[['⌂','Project','Tổng quan & cấu hình'],['A','Kết nối','Vault & công cụ'],['B','Outline','Keyword đến outline'],['C','Viết bài','Toàn bài & review'],['D','Đi inlink','Inventory & kiểm duyệt'],['E','Lịch sử','Version & audit log']];
const sidebar=(on)=>`<aside class="side"><div class="brand"><div class="brand-icon">☰</div><div><b>SEO Content Workflow</b><small>Evidence-led workspace</small></div></div><div class="project-select"><small>PROJECT ĐANG LÀM</small><div class="value">Huggies Vietnam &nbsp;⌄</div><div class="add">＋ Tạo Project</div></div><div class="nav">${nav.map((n,i)=>`<div class="navitem ${on===i?'active':''}"><span class="navbadge">${n[0]}</span><span><b>${n[1]}</b><small>${n[2]}</small></span></div>`).join('')}</div><div class="sidefoot">◇ &nbsp;Không tự publish<br>&nbsp;&nbsp;&nbsp;&nbsp;Không ghi vào Google Sheet</div></aside>`;
const shell=(on,body)=>`<div class="app">${sidebar(on)}<div class="main"><div class="top"><div><b>Huggies Vietnam</b><small>huggies.com.vn</small></div><div class="top-right"><span class="top-chip">Ngôn ngữ &nbsp; Tiếng Việt ⌄</span><span class="top-chip">◷ &nbsp; Outline v2 &nbsp;│&nbsp; Article ${on===3?'v1':'—'}</span></div></div><div class="body">${body}</div></div><span class="tag">GIAO DIỆN APP · DỮ LIỆU DEMO</span></div>`;
const frame=(n,title,body,caption)=>`<section class="scene" data-scene="${n}"><div class="titlebar"><div><small>SEO CONTENT WORKFLOW / BƯỚC 0${n} · MÔ PHỎNG UI / DỮ LIỆU DEMO</small><h1>${title}</h1></div><span class="counter">0${n} / 06</span></div>${body}<div class="foot"><span><b>SEO Content Workflow</b> · ${caption}</span><strong>ĐANG XÂY DỰNG & THỬ NGHIỆM</strong></div></section>`;
const field=(name,value,multi=false)=>`<div class="field"><label>${name}</label><div class="input ${multi?'multiline':''}">${value}</div></div>`;
const heading=(eyebrow,title,sub,action='')=>`<div class="section-head"><div><div class="eyebrow">${eyebrow}</div><h2 class="page-title">${title}</h2><p class="sub">${sub}</p></div>${action}</div>`;
const steps=(on)=>`<div class="steps">${['Keyword Workspace','SERP Research','Intent & Gaps','Outline Editor'].map((s,i)=>`<div class="step ${on===i?'on':''}"><i>${'ABCD'[i]}</i>${s}</div>`).join('')}</div>`;
const metrics=`<div class="metrics"><div class="metric"><small>INTENT FIT</small><b>82</b></div><div class="metric"><small>EVIDENCE</small><b>75</b></div><div class="metric"><small>COVERAGE</small><b>88</b></div><div class="metric"><small>INFORMATION GAIN</small><b>76</b></div><div class="metric"><small>CLARITY</small><b>90</b></div><div class="metric"><small>QUALITY GATE</small><b style="font-size:17px;color:#a96509">Chờ duyệt</b></div></div>`;
const agent=`<div class="agent"><b style="color:#ef6d19">✧</b><b>Agent Configuration</b><span>Thiết lập theo từng bước · chi tiết đã ẩn</span><span class="chev">⌄</span></div>`;

const s1=frame(1,'Project giữ chung mục tiêu và ngữ cảnh SEO',shell(0,`${heading('PROJECT OVERVIEW','Kiểm soát context trước khi chạy agent','Các bước sau dùng cùng mục tiêu, đối tượng đọc và quy tắc nội dung.','<span class="btn primary">▣ &nbsp; Lưu cấu hình</span>')}<div class="two-col"><div class="panel"><div class="panel-head"><b>Thông tin Project</b><small>Ngữ cảnh chung cho nghiên cứu, outline và bản nháp.</small></div><div class="panel-pad"><div class="formgrid">${field('Tên Project *','Huggies Vietnam')}${field('Website / domain *','huggies.com.vn')}${field('Ngôn ngữ *','Tiếng Việt ⌄')}${field('Thị trường','Việt Nam')}${field('Mục tiêu SEO','Bài tư vấn giúp phụ huynh lựa chọn sản phẩm phù hợp.',true)}${field('Đối tượng đọc','Cha mẹ có con nhỏ đang tìm hiểu và so sánh.',true)}</div></div></div><div><div class="panel"><div class="panel-head"><b>Tiến độ workflow</b><small>Chuyển bước sau khi người dùng duyệt kết quả.</small></div><div class="statusrow"><span class="circle">A</span><span><b>Outline</b><small>v2</small></span><span class="pill amber">Chờ duyệt</span></div><div class="statusrow"><span class="circle">B</span><span><b>Viết bài</b><small>Chờ outline được duyệt</small></span><span class="pill orange">Chưa bắt đầu</span></div><div class="statusrow"><span class="circle">C</span><span><b>Đi inlink</b><small>Chưa chuyển bước</small></span><span class="pill">Chờ</span></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><b>Hoạt động gần đây</b></div><div class="activity">◷ &nbsp; Cập nhật mục tiêu và đối tượng đọc</div><div class="activity">◷ &nbsp; Tạo outline bản demo để kiểm tra UI</div></div></div></div>`),'Bối cảnh Project và trạng thái từng chặng được quản lý trong cùng workspace');

const s2=frame(2,'Bắt đầu từ keyword và mục tiêu bài viết',shell(2,`${heading('TAB 1 · OUTLINE','Từ keyword đến outline có bằng chứng','Mỗi lần chạy tạo version mới; dữ liệu trước vẫn được giữ.')}${steps(0)}${metrics}<div class="panel"><div class="panel-head"><b>Keyword Workspace</b><small>Nhóm từ khóa và phạm vi bài viết là đầu vào để nghiên cứu.</small></div><div class="panel-pad"><div class="threegrid">${field('Tên nhóm keyword *','Chọn tã cho bé')}${field('Từ khóa chính *','tã Huggies')}${field('Từ khóa phụ','tã quần Huggies, chọn tã cho bé')}${field('Đối tượng đọc','Cha mẹ có con nhỏ')}${field('Thị trường','Việt Nam')}${field('Số ký tự mục tiêu','6.000 ±10%')}</div><div style="display:flex;justify-content:flex-end;margin-top:16px"><span class="btn primary">Tiếp tục tới SERP Research →</span></div></div></div>`),'Keyword, phạm vi và mục tiêu được nhập trước khi nghiên cứu');
